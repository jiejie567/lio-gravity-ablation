# MCD 手持 (kth_*/tuhh_*) — Ouster OS1-64 + 内置 IMU
# 外参同 ATV(Ouster 出厂内参)
common:
    lid_topic:  "/os_cloud_node/points"
    imu_topic:  "/os_cloud_node/imu"
    time_sync_en: false
    time_offset_lidar_to_imu: -0.1

preprocess:
    lidar_type: 3
    scan_line: 64
    timestamp_unit: 3
    blind: 0.5

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    180
    det_range:     150.0
    extrinsic_est_en:  false
    extrinsic_T: [ -0.006253, 0.011775, -0.007645 ]
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1 ]

publish:
    path_en:  false
    scan_publish_en:  true
    dense_publish_en: true
    scan_bodyframe_pub_en: true

pcd_save:
    pcd_save_en: false
    interval: -1
