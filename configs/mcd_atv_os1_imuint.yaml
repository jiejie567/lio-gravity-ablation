# MCD ATV (ntu_*) — Ouster OS1-128 + 内置 IMU (/os_cloud_node/imu)
# 外参 os_imu->os_sensor 由官方标定文件计算(= Ouster 出厂内参,ATV/手持两套设备一致):
#   T = inv(body->os_imu) @ (body->os_sensor)
common:
    lid_topic:  "/os_cloud_node/points"
    imu_topic:  "/os_cloud_node/imu"
    time_sync_en: false
    time_offset_lidar_to_imu: 0.0   # 同一设备内部,无跨传感器偏移

preprocess:
    lidar_type: 3                # ouster
    scan_line: 128
    timestamp_unit: 3            # ns
    blind: 0.5

mapping:
    acc_cov: 0.1                 # 内置 ICM 噪声较大,取 FAST-LIO ouster 默认
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    180
    det_range:     150.0
    extrinsic_est_en:  false
    extrinsic_T: [ -0.006253, 0.011775, -0.007645 ]
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1 ]

publish:
    path_en:  false
    scan_publish_en:  true
    dense_publish_en: true
    scan_bodyframe_pub_en: true

pcd_save:
    pcd_save_en: false
    interval: -1
