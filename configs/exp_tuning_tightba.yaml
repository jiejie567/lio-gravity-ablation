# 中间方案: 冻结重力 + 收紧(而非冻死)ba 的随机游走。
# 动机: B 的发散机理是 Q 阵不对称 —— 冻住重力后残差无人分担,ba 带着永久
# 随机游走独自消化,可能自增强跑飞。把 b_acc_cov 降两个数量级,保留吸收能力
# 但限制跑飞速度,理论上可同时拿到 B 的精度与 C 的稳定性。
# 注意: 发散不可复现(1/16),本组只能验证"精度不掉 + ba 有界"这一必要条件。
point_filter_num: 3
max_iteration: 4
filter_size_surf: 0.4
filter_size_map: 0.4
mapping:
  b_acc_cov: 0.000001      # 1e-4 → 1e-6
